<!DOCTYPE html>
<html>
<head>
	<!-- Load VersaTiles Style -->
	<script src="https://tiles.versatiles.org/assets/lib/versatiles-style/versatiles-style.js"></script>
	<!-- Load MapLibre GL JS -->
	<script src="https://tiles.versatiles.org/assets/lib/maplibre-gl/maplibre-gl.js"></script>
	<link href="https://tiles.versatiles.org/assets/lib/maplibre-gl/maplibre-gl.css" rel="stylesheet" />
</head>

<body>
	<!-- Define the map container -->
	<div id="map" style="height:100vh"></div>

	<!-- Initialize the map -->
	<script type="module">
		const style = VersaTilesStyle.osm({
			urls: { base: 'https://tiles.versatiles.org' }, // where tiles, sprites and fonts come from
			features: {
				terrain: { exaggeration: 1.5 }, // lift the map into the third dimension
				hillshade: true, // shade the slopes, so the relief is visible from above too
			},
		});

		new maplibregl.Map({
			container: 'map',
			style: await VersaTilesStyle.inlineSources(style), // resolve the tile URLs
			center: [7.6586, 45.9763], // Matterhorn
			zoom: 12.2,
			pitch: 75, // tilt the camera towards the horizon
			bearing: 215, // look south-west, the classic view from Zermatt
			maxPitch: 85, // MapLibre stops tilting at 60° by default
		});
	</script>
</body>

</html>
