version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-action: { patterns: ['*'] }
      security: { applies-to: security-updates, patterns: ['*'] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ['*'] }
      security: { applies-to: security-updates, patterns: ['*'] }
    versioning-strategy: increase-if-necessary
